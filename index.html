<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d20">
<title>MEZORA — Learn Beyond Limits</title>
<style>
:root{--bg:#080d20;--panel:#101a34;--panel2:#142140;--line:#26375f;--blue:#28a8ff;--cyan:#38e1ff;--gold:#f5c45e;--text:#f4f7ff;--muted:#9baac8;--purple:#8b6cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#1a3670 0,#080d20 43%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #24365d;background:#080d20eF;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:2px;font-size:19px}.brandmark{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#0c2d67,#10152e);border:1px solid #2b9eff;display:grid;place-items:center;color:white;font-size:25px;font-weight:900;text-shadow:0 0 12px #28a8ff;box-shadow:0 0 18px #167bdb55}
.topright{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#1d91ff,#7c5bff);font-weight:800}
.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 66px)}.sidebar{padding:22px 14px;border-right:1px solid #1d2b4c}.navbtn{width:100%;display:flex;align-items:center;gap:12px;padding:12px 13px;border:0;border-radius:12px;background:transparent;color:var(--muted);text-align:left;margin:4px 0}.navbtn.active,.navbtn:hover{background:#17305a;color:white}.navbtn.active{box-shadow:inset 3px 0 var(--cyan)}.navicon{width:22px;text-align:center;font-size:17px}.sidehint{margin:26px 10px 0;color:#7586aa;font-size:12px;line-height:1.6}
main{padding:26px;min-width:0}.welcome{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:2px;font-weight:800}.welcome h1{font-size:clamp(24px,4vw,34px);margin:6px 0}.muted{color:var(--muted)}.small{font-size:13px}.btn{border:1px solid #337ac0;background:linear-gradient(135deg,#167ad4,#4b5fe0);color:white;border-radius:11px;padding:11px 15px;font-weight:700}.btn.secondary{background:#142343;border-color:#33476f}.btn.gold{background:linear-gradient(135deg,#d69b37,#f5d47a);color:#1b1930;border:0}.btn:active{transform:scale(.98)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:linear-gradient(145deg,#142344,#0e1830);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 12px 35px #0002}.stat{display:flex;align-items:center;gap:13px}.staticon{width:43px;height:43px;border-radius:13px;background:#1a3764;display:grid;place-items:center;font-size:21px}.stat strong{font-size:23px;display:block}.stat span{font-size:12px;color:var(--muted)}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:25px 0 13px}.sectionhead h2{font-size:19px;margin:0}.course{display:flex;flex-direction:column;gap:12px}.courseart{height:105px;border-radius:12px;display:grid;place-items:center;font-size:38px;background:radial-gradient(circle at 25% 20%,#326fc0,#17234a 65%)}.course h3{margin:0;font-size:16px}.progress{height:7px;background:#263657;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:9px}.coursefoot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.panel{background:#101a34;border:1px solid var(--line);border-radius:17px;padding:18px;margin-bottom:15px}.panel h2,.panel h3{margin-top:0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#17345b;color:#8edcff;font-size:11px}.field{width:100%;padding:12px 13px;background:#091329;border:1px solid #30436b;border-radius:10px;color:white;outline:none;margin:6px 0 12px}.field:focus{border-color:var(--cyan)}textarea.field{min-height:90px;resize:vertical}.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#1c4383,#080d20 55%)}.auth{width:min(440px,100%);background:#101a34;border:1px solid #2b4778;border-radius:22px;padding:26px;box-shadow:0 25px 80px #0008}.auth .brand{justify-content:center;font-size:24px;margin-bottom:20px}.auth h1{text-align:center;margin:10px 0 5px}.auth p{text-align:center}.authswitch{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}.linkbtn{border:0;background:none;color:var(--cyan);font-weight:700}
.listitem{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #26375a}.listitem:last-child{border:0}.listicon{width:42px;height:42px;border-radius:12px;background:#1a3560;display:grid;place-items:center;font-size:20px;flex-shrink:0}.listitem .grow{flex:1;min-width:0}.listitem strong{display:block}.listitem small{color:var(--muted)}
.quizopt{display:block;width:100%;text-align:left;padding:12px;border:1px solid #34476d;border-radius:10px;background:#0c1730;color:white;margin:8px 0}.quizopt:hover{border-color:var(--cyan)}.feedback{padding:12px;border-radius:10px;margin-top:12px;background:#17345b}
.chatbox{height:340px;overflow:auto;padding:12px;background:#091329;border:1px solid #2b3d63;border-radius:13px;margin:12px 0}.bubble{max-width:88%;padding:11px 13px;border-radius:13px;margin:9px 0;line-height:1.5;font-size:14px;white-space:pre-wrap}.bubble.bot{background:#172b50;border:1px solid #2b4778}.bubble.user{background:#155c9b;margin-left:auto}.chatrow{display:flex;gap:8px}.chatrow input{flex:1;min-width:0}
.empty{text-align:center;padding:28px;color:var(--muted)}.mobilebar{display:none}
@media(max-width:760px){.layout{display:block}.sidebar{display:none}main{padding:18px 14px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:13px}.welcome{align-items:flex-start}.welcome .btn{padding:9px;font-size:12px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0b1429f2;border-top:1px solid #26375f;z-index:8;justify-content:space-around;padding:7px 3px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.mobilebar button{border:0;background:none;color:#9baac8;font-size:10px;display:flex;flex-direction:column;gap:3px;align-items:center}.mobilebar button.active{color:var(--cyan)}.mobilebar b{font-size:19px;font-weight:400}.topbar{padding:0 13px}}
@media(max-width:380px){.grid{grid-template-columns:1fr}.welcome{display:block}.welcome .btn{margin-top:10px}}
</style>
</head>
<body>
<div id="authView" class="authwrap">
  <div class="auth">
    <div class="brand"><div class="brandmark">M</div> MEZORA</div>
    <div id="loginBox">
      <h1>Welcome back</h1><p class="muted small">Continue your learning journey.</p>
      <label class="small">Email or username</label><input id="loginName" class="field" placeholder="Enter your email or username" autocomplete="username">
      <label class="small">Password</label><input id="loginPass" class="field" type="password" placeholder="Enter password" autocomplete="current-password">
      <button class="btn" style="width:100%" onclick="login()">Log in</button>
      <div class="authswitch">New to MEZORA? <button class="linkbtn" onclick="showSignup()">Create account</button></div>
    </div>
    <div id="signupBox" class="hidden">
      <h1>Create account</h1><p class="muted small">Start learning with MEZORA.</p>
      <label class="small">Your name</label><input id="signupName" class="field" placeholder="Your name" autocomplete="name">
      <label class="small">Email or username</label><input id="signupUser" class="field" placeholder="Choose a username">
      <label class="small">Password</label><input id="signupPass" class="field" type="password" placeholder="At least 4 characters">
      <button class="btn" style="width:100%" onclick="signup()">Create account</button>
      <div class="authswitch">Already registered? <button class="linkbtn" onclick="showLogin()">Log in</button></div>
    </div>
    <p class="muted" style="font-size:11px;margin-top:20px">Demo version: account details are stored only in this browser on this device. Do not use a real password.</p>
  </div>
</div>
<div id="appView" class="hidden">
<header class="topbar"><div class="brand"><div class="brandmark">M</div> MEZORA</div><div class="topright"><span class="muted small" id="topName"></span><div class="avatar" id="topAvatar">M</div></div></header>
<div class="layout">
<aside class="sidebar" id="sideNav"></aside>
<main id="main"></main>
</div>
<nav class="mobilebar" id="mobileNav"></nav>
</div>
<script>
const navItems=[["home","⌂","Home"],["courses","▤","Courses"],["library","▧","PDF Library"],["practice","✓","Practice"],["planner","▦","Study Planner"],["mira","✦","MIRA AI"],["profile","●","Profile"]];
let currentUser=null,activePage="home",quizAnswered=false;
const $=id=>document.getElementById(id);
function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function getUsers(){try{return JSON.parse(localStorage.getItem("mezora_users")||"{}")}catch(e){return {}}}
function showSignup(){$("loginBox").classList.add("hidden");$("signupBox").classList.remove("hidden")}
function showLogin(){$("signupBox").classList.add("hidden");$("loginBox").classList.remove("hidden")}
function signup(){let name=$("signupName").value.trim(),user=$("signupUser").value.trim().toLowerCase(),pass=$("signupPass").value;if(!name||!user||pass.length<4){alert("Please complete all fields. Password must be at least 4 characters.");return}let users=getUsers();if(users[user]){alert("This username already exists.");return}users[user]={name,pass};localStorage.setItem("mezora_users",JSON.stringify(users));currentUser={name,user};startApp()}
function login(){let user=$("loginName").value.trim().toLowerCase(),pass=$("loginPass").value,record=getUsers()[user];if(!record||record.pass!==pass){alert("Account not found or password is incorrect. Create a demo account first.");return}currentUser={name:record.name,user};startApp()}
function logout(){currentUser=null;$("appView").classList.add("hidden");$("authView").classList.remove("hidden");showLogin()}
function startApp(){$("authView").classList.add("hidden");$("appView").classList.remove("hidden");$("topName").textContent=currentUser.name;$("topAvatar").textContent=currentUser.name.charAt(0).toUpperCase();renderNav();go("home")}
function renderNav(){let make=mobile=>navItems.map(([id,ic,label])=>`<button class="${activePage===id?"active":""} ${mobile?"":"navbtn"}" onclick="go('${id}')">${mobile?`<b>${ic}</b><span>${label}</span>`:`<span class="navicon">${ic}</span>${label}`}</button>`).join("");$("sideNav").innerHTML=make(false)+`<div class="sidehint">MEZORA<br>Learn Beyond Limits.<br><br>Keep learning. Keep growing.</div>`;$("mobileNav").innerHTML=make(true)}
function go(page){activePage=page;renderNav();let views={home:homePage,courses:coursesPage,library:libraryPage,practice:practicePage,planner:plannerPage,mira:miraPage,profile:profilePage};$("main").innerHTML=views[page]()}
function homePage(){return `<div class="welcome"><div><div class="eyebrow">YOUR LEARNING SPACE</div><h1>Welcome, ${safe(currentUser.name)} 👋</h1><div class="muted">Small steps every day lead to big results.</div></div><button class="btn gold" onclick="go('courses')">Explore courses →</button></div>
<div class="grid"><div class="card stat"><div class="staticon">📚</div><div><strong>03</strong><span>Sample courses</span></div></div><div class="card stat"><div class="staticon">📄</div><div><strong>02</strong><span>Study resources</span></div></div><div class="card stat"><div class="staticon">🎯</div><div><strong>01</strong><span>Practice quiz</span></div></div></div>
<div class="sectionhead"><h2>Continue learning</h2><button class="linkbtn" onclick="go('courses')">View all</button></div><div class="grid">
${courseCard("💻","Web Development Basics","Technology","Beginner","35%")}
${courseCard("🧠","AI & Smart Learning","Artificial Intelligence","Beginner","20%")}
${courseCard("📈","Business Foundations","Business","Starter","10%")}</div>
<div class="sectionhead"><h2>Your tools</h2></div><div class="grid"><div class="card" onclick="go('mira')" style="cursor:pointer"><div class="staticon">✦</div><h3>MIRA AI</h3><p class="muted small">Ask study questions and get guidance.</p></div><div class="card" onclick="go('planner')" style="cursor:pointer"><div class="staticon">🗓️</div><h3>Study Planner</h3><p class="muted small">Organise your learning tasks.</p></div><div class="card" onclick="go('practice')" style="cursor:pointer"><div class="staticon">✓</div><h3>Practice</h3><p class="muted small">Test what you have learned.</p></div></div>`}
function courseCard(icon,title,category,level,progress){return `<div class="card course"><div class="courseart">${icon}</div><span class="pill">${category}</span><h3>${title}</h3><div class="coursefoot"><span>${level}</span><span>${progress} complete</span></div><div class="progress"><i style="width:${progress}"></i></div><button class="btn secondary" onclick="alert('This is a sample course card. Add real lessons from the future admin panel.')">Open course</button></div>`}
function coursesPage(){return `<div class="welcome"><div><div class="eyebrow">GROW YOUR SKILLS</div><h1>Courses</h1><p class="muted">Explore sample learning paths.</p></div></div><div class="grid">${courseCard("💻","Web Development Basics","Technology","Beginner","35%")}${courseCard("🧠","AI & Smart Learning","AI","Beginner","20%")}${courseCard("📈","Business Foundations","Business","Starter","10%")}${courseCard("🎨","Creative Design","Design","Beginner","0%")}${courseCard("🌍","English Communication","Language","Beginner","0%")}${courseCard("🔐","Digital Safety","Technology","Starter","0%")}</div>`}
function libraryPage(){return `<div class="welcome"><div><div class="eyebrow">YOUR STUDY MATERIALS</div><h1>PDF Library</h1><p class="muted">Sample resource shelf. Add your own files in a future backend.</p></div></div><div class="panel"><div class="listitem"><div class="listicon">📄</div><div class="grow"><strong>Study Notes Template</strong><small>Sample resource · PDF placeholder</small></div><span class="pill">Sample</span></div><div class="listitem"><div class="listicon">📘</div><div class="grow"><strong>Learning Roadmap</strong><small>Sample resource · PDF placeholder</small></div><span class="pill">Sample</span></div><div class="empty">Real PDF upload, storage and download links need backend storage.</div></div>`}
function practicePage(){return `<div class="welcome"><div><div class="eyebrow">CHECK YOUR KNOWLEDGE</div><h1>Practice Quiz</h1><p class="muted">A short sample quiz.</p></div></div><div class="panel"><span class="pill">Question 1 of 1</span><h2 style="margin-top:15px">What does HTML stand for?</h2><div id="quizOptions"><button class="quizopt" onclick="answerQuiz(this,false)">A. High Text Machine Language</button><button class="quizopt" onclick="answerQuiz(this,true)">B. HyperText Markup Language</button><button class="quizopt" onclick="answerQuiz(this,false)">C. Hyper Transfer Main Link</button></div><div id="quizFeedback"></div><button class="btn secondary" style="margin-top:14px" onclick="go('practice')">Try again</button></div>`}
function answerQuiz(el,correct){if(quizAnswered)return;quizAnswered=true;el.style.borderColor=correct?"#35d99b":"#ff7777";$("quizFeedback").innerHTML=`<div class="feedback">${correct?"Correct! Well done.":"Not quite. The correct answer is B: HyperText Markup Language."}</div>`}
function plannerPage(){let tasks=JSON.parse(localStorage.getItem("mezora_tasks_"+currentUser.user)||"[]");return `<div class="welcome"><div><div class="eyebrow">PLAN YOUR PROGRESS</div><h1>Study Planner</h1><p class="muted">Create a simple personal study checklist.</p></div></div><div class="panel"><h3>Add a study task</h3><div class="row"><input id="taskInput" class="field" style="margin:0" placeholder="e.g. Revise HTML basics"><button class="btn" onclick="addTask()">Add</button></div></div><div class="panel"><h3>Your tasks</h3><div id="taskList">${tasks.length?tasks.map((t,i)=>`<div class="listitem"><input type="checkbox" ${t.done?"checked":""} onchange="toggleTask(${i},this.checked)"><div class="grow"><strong style="${t.done?"text-decoration:line-through;color:#91a0bc":""}">${safe(t.text)}</strong><small>Personal study task</small></div><button class="linkbtn" onclick="deleteTask(${i})">Delete</button></div>`).join(""):'<div class="empty">No tasks yet. Add your first study task above.</div>'}</div></div>`}
function saveTasks(t){localStorage.setItem("mezora_tasks_"+currentUser.user,JSON.stringify(t))}
function addTask(){let v=$("taskInput").value.trim();if(!v)return;let t=JSON.parse(localStorage.getItem("mezora_tasks_"+currentUser.user)||"[]");t.push({text:v,done:false});saveTasks(t);go("planner")}
function toggleTask(i,done){let t=JSON.parse(localStorage.getItem("mezora_tasks_"+currentUser.user)||"[]");t[i].done=done;saveTasks(t);go("planner")}
function deleteTask(i){let t=JSON.parse(localStorage.getItem("mezora_tasks_"+currentUser.user)||"[]");t.splice(i,1);saveTasks(t);go("planner")}
function miraPage(){return `<div class="welcome"><div><div class="eyebrow">MEZORA INTELLIGENT LEARNING ASSISTANT</div><h1>MIRA AI <span class="pill">Demo</span></h1><p class="muted">Your study companion interface.</p></div></div><div class="panel"><div class="chatbox" id="chatbox"><div class="bubble bot">Hello ${safe(currentUser.name)}! I’m MIRA, your MEZORA learning assistant demo. Ask me about study planning, learning concepts, or course ideas.</div></div><div class="chatrow"><input id="miraInput" class="field" style="margin:0" placeholder="Ask MIRA something..." onkeydown="if(event.key==='Enter')sendMira()"><button class="btn" onclick="sendMira()">Send</button></div><p class="muted" style="font-size:11px">Demo replies only. This chat is not connected to a live AI model.</p></div>`}
function sendMira(){let input=$("miraInput"),msg=input.value.trim();if(!msg)return;let box=$("chatbox");box.innerHTML+=`<div class="bubble user">${safe(msg)}</div>`;input.value="";let low=msg.toLowerCase(),reply="I’m a demo assistant right now. Try asking for a simple study plan, an explanation of HTML, or tips for staying organised.";if(low.includes("html"))reply="HTML stands for HyperText Markup Language. It provides the structure of a web page using elements such as headings, paragraphs, links and buttons.";else if(low.includes("plan")||low.includes("study"))reply="Try this study routine: 1) Choose one small topic. 2) Study it for 25 minutes. 3) Take a 5-minute break. 4) Practise with questions. 5) Review what you learned.";else if(low.includes("hello")||low.includes("hi"))reply="Hello! What are you learning today?";box.innerHTML+=`<div class="bubble bot">${safe(reply)}</div>`;box.scrollTop=box.scrollHeight}
function profilePage(){return `<div class="welcome"><div><div class="eyebrow">YOUR ACCOUNT</div><h1>Profile</h1><p class="muted">Manage this local demo profile.</p></div></div><div class="panel"><div class="row"><div class="stat"><div class="avatar">${safe(currentUser.name.charAt(0).toUpperCase())}</div><div><strong style="font-size:18px">${safe(currentUser.name)}</strong><span>${safe(currentUser.user)}</span></div></div><span class="pill">Demo account</span></div><hr style="border-color:#26375f;margin:20px 0"><p class="muted small">Your demo account is stored in this browser only. It will not sync to another phone or browser.</p><button class="btn secondary" onclick="logout()">Log out</button></div><div class="panel"><h3>About MEZORA</h3><p class="muted">Learn Beyond Limits.</p><p class="small muted">This is an early frontend prototype. It does not yet have secure online authentication, cloud storage, payments, or live AI.</p></div>`}
</script>
</body>
</html>
